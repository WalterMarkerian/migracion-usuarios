spring.profiles.active=dev
spring.datasource.source-db.jdbc-url=jdbc:h2:mem:source_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.source-db.username=sa
spring.datasource.source-db.password=
spring.datasource.source-db.driver-class-name=org.h2.Driver
spring.datasource.target-db.jdbc-url=jdbc:h2:mem:target_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.target-db.username=sa
spring.datasource.target-db.password=
spring.datasource.target-db.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:/db/data.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
logging.level.com.sportclub.migracion_usuarios=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
